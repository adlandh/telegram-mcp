version: '3'

tasks:
  build:
    desc: Build the MCP server
    cmds:
      - go build -o bin/telegram-mcp .
  test:
    desc: Run offline tests and the race detector
    cmds:
      - go test -race ./...
  lint:
    desc: Run Go linters
    cmds:
      - curl -fsS https://raw.githubusercontent.com/adlandh/golangci-lint-config/refs/heads/main/.golangci.yml -o .golangci.yml
      - golangci-lint run ./...
  fmt:
    cmds:
      - gofmt -w *.go internal
