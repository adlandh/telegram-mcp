<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Telegram MCP — your account, connected to MCP</title>
  <desc id="desc">A Go server connecting MCP clients over stdio or authenticated HTTP to a personal Telegram account over MTProto.</desc>
  <rect width="1200" height="400" rx="24" fill="#102331"/>
  <g id="project-title" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="64" y="64" fill="#6BC6F5" font-size="22" font-weight="600" letter-spacing="2">PERSONAL ACCOUNT · MTProto</text>
    <text x="60" y="162" fill="#F4F8FB" font-size="88" font-weight="700" letter-spacing="-3">Telegram MCP</text>
    <text x="64" y="214" fill="#B5C9D7" font-size="32">Read chats. Search messages. Keep the context.</text>
  </g>
  <g id="connection-flow" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="32">
    <path d="M64 266H1136" stroke="#355366" stroke-width="2"/>
    <text x="64" y="338" fill="#F4F8FB">MCP client</text>
    <path d="M271 326H335m-12-10 12 10-12 10" fill="none" stroke="#6BC6F5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="383" y="338" fill="#6BC6F5" font-weight="600">Telegram MCP</text>
    <path d="M670 326H734m-12-10 12 10-12 10" fill="none" stroke="#6BC6F5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="782" y="338" fill="#F4F8FB">Your Telegram</text>
    <text x="271" y="296" fill="#B5C9D7" font-size="20">stdio / HTTP</text>
    <text x="674" y="296" fill="#B5C9D7" font-size="20">MTProto</text>
  </g>
</svg>
